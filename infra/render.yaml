# Render Blueprint for Summerfield HQ.
# Not applied yet. Read infra/README.md before connecting it. When creating the Blueprint in Render,
# set its file path to infra/render.yaml. Secret values are entered in the Render dashboard (sync: false).
# These are the production services (branch main). dev, test, and stage get copies when needed: see infra/README.md.
services:
  # Frontend: static React build. Hash routes mean no rewrite rules are needed.
  - type: web
    name: summerfield-hq-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

